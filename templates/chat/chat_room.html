<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат - {{ room_name }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            margin-bottom: 15px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            font-size: 14px;
        }

        .message:not(.own) .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-radius: 12px 12px 12px 0;
        }

        .message.own .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 12px;
        }

        .message-info {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
            padding: 0 10px;
        }

        .message:not(.own) .message-info {
            text-align: left;
        }

        .message.own .message-info {
            text-align: right;
        }

        .status-message {
            text-align: center;
            font-size: 12px;
            color: #999;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            margin: 10px 0;
        }

        .chat-input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        .chat-input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .chat-input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .chat-input-area button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .chat-input-area button:active {
            transform: translateY(0);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #ccc #f8f9fa;
        }

        .scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar::-webkit-scrollbar-track {
            background: #f8f9fa;
        }

        .scrollbar::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        .scrollbar::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }

            .chat-header h1 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>💬 Чат</h1>
            <p>Кімната: <strong>{{ room_name }}</strong></p>
        </div>

        <div class="chat-messages scrollbar" id="chatMessages">
            {% for message in messages %}
                <div class="message {% if message.user.id == request.user.id %}own{% endif %}">
                    <div>
                        <div class="message-content">
                            {{ message.content }}
                        </div>
                        <div class="message-info">
                            <strong>{{ message.user.username }}</strong> • 
                            {{ message.timestamp|date:"H:i" }}
                        </div>
                    </div>
                </div>
            {% empty %}
                <div class="loading">Повідомлень немає. Будьте першим!</div>
            {% endfor %}
        </div>

        <div class="chat-input-area">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Напишіть повідомлення..."
                autocomplete="off"
            >
            <button id="sendButton">Відправити</button>
        </div>
    </div>

    <script>
        const roomName = '{{ room_name }}';
        const username = '{{ request.user.username }}';
        const userId = {{ request.user.id }};

        // Підключення до WebSocket
        const chatSocket = new WebSocket(
            `ws://${window.location.host}/ws/chat/${roomName}/`
        );

        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const chatMessages = document.getElementById('chatMessages');

        chatSocket.onopen = function(e) {
            console.log('WebSocket підключено');
            if (chatMessages.children.length === 1 && 
                chatMessages.children[0].classList.contains('loading')) {
                chatMessages.innerHTML = '';
            }
        };

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);

            if (data.type === 'message') {
                addMessage(data);
            } else if (data.type === 'status') {
                addStatusMessage(data);
            }
        };

        chatSocket.onerror = function(error) {
            console.error('WebSocket помилка:', error);
        };

        chatSocket.onclose = function(e) {
            console.log('WebSocket закритий');
        };

        function addMessage(data) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${data.is_own ? 'own' : ''}`;

            const timestamp = new Date(data.timestamp).toLocaleTimeString('uk-UA', {
                hour: '2-digit',
                minute: '2-digit'
            });

            messageDiv.innerHTML = `
                <div>
                    <div class="message-content">
                        ${escapeHtml(data.message)}
                    </div>
                    <div class="message-info">
                        <strong>${escapeHtml(data.username)}</strong> • ${timestamp}
                    </div>
                </div>
            `;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addStatusMessage(data) {
            const statusDiv = document.createElement('div');
            statusDiv.className = 'status-message';
            statusDiv.textContent = data.message;

            chatMessages.appendChild(statusDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendMessage() {
            const message = messageInput.value.trim();

            if (message) {
                chatSocket.send(JSON.stringify({
                    'message': message,
                    'type': 'message'
                }));

                messageInput.value = '';
                messageInput.focus();
            }
        }

        sendButton.onclick = sendMessage;

        messageInput.onkeyup = function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        };

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        chatMessages.scrollTop = chatMessages.scrollHeight;
    </script>
</body>
</html>
